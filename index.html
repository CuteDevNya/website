<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOUD</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
img {
  width: 100vw;
  height: 100vh;
  object-fit: fill;
  animation: warp 3s infinite alternate;
}
@keyframes warp {
  0% { transform: scaleX(1) scaleY(1); }
  100% { transform: scaleX(1.2) scaleY(0.8); }
}
</style>
</head>
<body>
<img src="image.svg">
<audio id="a" src="sound.wav" autoplay loop></audio>
<script>
const a = document.getElementById('a');
a.volume = 1.0;
document.body.addEventListener('click', ()=>a.play());
</script>
</body>
</html>
